<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cold Coffee Cafe</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--text:#2b1d14;--muted:#7a6a5c;--accent:#7b4a2a;--accent-text:#fff;--line:#e8dccb;--green:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#1a120d;--card:#271b14;--text:#f5eadd;--muted:#b7a591;--accent:#d49a6a;--accent-text:#1a120d;--line:#3a2a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 120px}
header{text-align:center;padding:12px 0 20px}
.logo{font-size:44px}
h1{margin:4px 0 2px;font-size:28px;color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:14px}
h2{font-size:16px;margin:22px 0 10px}
.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tables button{padding:12px 0;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
.tables button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.name{font-weight:700;font-size:17px}
.price{color:var(--muted);margin-top:2px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent);background:var(--bg);color:var(--accent);font-size:20px;font-weight:700;cursor:pointer}
.qty b{min-width:20px;text-align:center;font-size:17px}
.big{width:100%;margin-top:8px;padding:14px;border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.pay{border-color:var(--green);color:var(--green)}
.bill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;display:none}
.bill.open{display:block}
.oh{font-weight:800;margin-top:12px;color:var(--accent)}
.oh:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.sub{display:flex;justify-content:space-between;padding:6px 0;font-weight:700}
.sum{margin-top:12px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:20px;padding-top:8px}
.empty{color:var(--muted);font-size:14px}
.sm{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:10px;cursor:pointer;padding:0}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar div{max-width:520px;margin:0 auto}
#place{width:100%;background:var(--green);color:#fff;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer}
#place:disabled{background:var(--line);color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">☕</div>
    <h1>Cold Coffee Cafe</h1>
    <p>Table chunein, items chunein, phir order place karein</p>
  </header>

  <h2>1. Apna Table Number chunein</h2>
  <div class="tables" id="tables"></div>

  <h2>2. Menu (jitne chahiye utne chunein)</h2>
  <div id="menu"></div>

  <button class="big" id="waiter">🔔 Waiter ko bulayein</button>
  <button class="big" id="billToggle">🧾 Mera Bill dekhein</button>

  <div class="bill" id="bill">
    <div id="billBody"></div>
    <button class="big" id="billSend">Bill maangein (owner ko bhejein)</button>
    <button class="big pay" id="payAsk">💳 Payment QR / UPI ID maangein</button>
    <button class="sm" id="clearBtn">Bill saaf karein (naya customer)</button>
  </div>

  <p class="hint">Order place karte hi WhatsApp khulega aur table number ke saath order cafe owner ko jayega.</p>
</div>

<div id="bar"><div><button id="place" disabled>Order place karein</button></div></div>
<div id="toast"></div>

<script>
var LINK="https://wa.me/919302553910";
var ITEMS=[{name:"Masala Chai",price:20,icon:"🍵"},{name:"Cold Coffee",price:80,icon:"🥤"},{name:"Hot Coffee",price:90,icon:"☕"},{name:"Black Coffee",price:50,icon:"☕"},{name:"Lemon Tea",price:80,icon:"🍋"},{name:"Green Tea",price:80,icon:"🍵"},{name:"Ice Blue",price:100,icon:"🧊"},{name:"Cold Brew",price:120,icon:"🥤"},{name:"Redbull Ice Tea",price:150,icon:"🥤"},{name:"Ice Coffee",price:100,icon:"🧊"}];
var KEY="ccc_orders3", EXPIRY=8*60*60*1000;
var table=null, cart=[], orders=[];
ITEMS.forEach(function(){cart.push(0)});

try{
  var s=localStorage.getItem(KEY);
  if(s){orders=JSON.parse(s)||[]}
  if(orders.length&&Date.now()-orders[orders.length-1].t>EXPIRY){orders=[]}
}catch(e){orders=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){}}

var tEl=document.getElementById("tables");
for(var i=1;i<=5;i++){(function(n){
  var b=document.createElement("button");b.textContent=n;
  b.onclick=function(){table=n;[].forEach.call(tEl.children,function(c){c.classList.remove("on")});b.classList.add("on")};
  tEl.appendChild(b);
})(i)}

var mEl=document.getElementById("menu");
ITEMS.forEach(function(it,idx){
  var d=document.createElement("div");d.className="item";
  d.innerHTML='<div><div class="name">'+it.icon+' '+it.name+'</div><div class="price">₹ '+it.price+'</div></div>'+
  '<div class="qty"><button aria-label="kam">−</button><b id="q'+idx+'">0</b><button aria-label="zyada">+</button></div>';
  var bs=d.querySelectorAll("button");
  bs[0].onclick=function(){if(cart[idx]>0){cart[idx]--;refresh()}};
  bs[1].onclick=function(){if(cart[idx]<20){cart[idx]++;refresh()}};
  mEl.appendChild(d);
});

function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},3500)}
function send(msg){
  toast("WhatsApp khul raha hai... bas Send dabayein.");
  var url=LINK+"?text="+encodeURIComponent(msg);
  setTimeout(function(){var w=window.open(url,"_blank");if(!w){location.href=url}},600);
}
function needTable(){
  if(!table){toast("Pehle apna Table Number chunein");tEl.scrollIntoView({behavior:"smooth"});return true}
  return false;
}
function cartCount(){var n=0;cart.forEach(function(q){n+=q});return n}
function cartTotal(){var t=0;cart.forEach(function(q,i){t+=q*ITEMS[i].price});return t}
function allTotal(){var t=0;orders.forEach(function(o){t+=o.total});return t}
function tm(t){return new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

function refresh(){
  cart.forEach(function(q,i){document.getElementById("q"+i).textContent=q});
  var p=document.getElementById("place"),n=cartCount();
  p.disabled=n===0;
  p.textContent=n===0?"Order place karein":"Order place karein ("+n+" items, ₹"+cartTotal()+")";
}

function renderBill(){
  var el=document.getElementById("billBody");
  if(!orders.length){el.innerHTML='<div class="empty">Abhi tak koi order place nahi hua.</div>';return}
  var h="";
  orders.forEach(function(o,k){
    h+='<div class="oh">Order '+(k+1)+' ('+tm(o.t)+')</div>';
    o.items.forEach(function(b){h+='<div class="row"><span>'+b.q+' x '+b.name+'</span><span>₹ '+(b.price*b.q)+'</span></div>'});
    h+='<div class="sub"><span>Order '+(k+1)+' ka bill</span><span>₹ '+o.total+'</span></div>';
  });
  var tot=allTotal();
  h+='<div class="sum">';
  if(orders.length>=2){
    var last=orders[orders.length-1].total;
    h+='<div><span>Pehle ke orders ka bill</span><span>₹ '+(tot-last)+'</span></div>';
    h+='<div><span>Abhi ke order ka bill</span><span>₹ '+last+'</span></div>';
  }
  h+='<div class="total"><span>Total Bill</span><span>₹ '+tot+'</span></div></div>';
  el.innerHTML=h;
}

document.getElementById("place").onclick=function(){
  if(needTable())return;
  if(cartCount()===0)return;
  var items=[];
  var m="Naya Order - Cold Coffee Cafe\nTable No: "+table+"\nOrder No: "+(orders.length+1)+"\n\n";
  cart.forEach(function(q,i){
    if(q>0){
      var it=ITEMS[i];
      items.push({name:it.name,price:it.price,q:q});
      m+=q+" x "+it.name+" = ₹"+(q*it.price)+"\n";
    }
  });
  var tot=cartTotal();
  m+="\nIs order ka Total: ₹"+tot;
  orders.push({t:Date.now(),items:items,total:tot});
  save();renderBill();
  cart=cart.map(function(){return 0});refresh();
  send(m);
};

document.getElementById("waiter").onclick=function(){
  if(needTable())return;
  send("🔔 Waiter chahiye - Cold Coffee Cafe\nTable No: "+table);
};

document.getElementById("billToggle").onclick=function(){
  var b=document.getElementById("bill");b.classList.toggle("open");
  this.textContent=b.classList.contains("open")?"🧾 Bill chhupayein":"🧾 Mera Bill dekhein";
};

document.getElementById("billSend").onclick=function(){
  if(needTable())return;
  if(!orders.length){toast("Abhi koi order place nahi hua");return}
  var m="🧾 Bill chahiye - Cold Coffee Cafe\nTable No: "+table+"\n";
  orders.forEach(function(o,k){
    m+="\nOrder "+(k+1)+" ("+tm(o.t)+")\n";
    o.items.forEach(function(b){m+=b.q+" x "+b.name+" = ₹"+(b.price*b.q)+"\n"});
    m+="Order "+(k+1)+" ka bill: ₹"+o.total+"\n";
  });
  m+="\nTotal Bill: ₹"+allTotal();
  send(m);
};

document.getElementById("payAsk").onclick=function(){
  if(needTable())return;
  if(!orders.length){toast("Abhi koi order place nahi hua");return}
  send("💳 Payment ke liye QR / UPI ID chahiye - Cold Coffee Cafe\nTable No: "+table+"\nTotal Bill: ₹"+allTotal());
};

document.getElementById("clearBtn").onclick=function(){
  if(orders.length&&!confirm("Bill saaf karein?"))return;
  orders=[];save();renderBill();
};

renderBill();refresh();
</script>
</body>
  </html>
